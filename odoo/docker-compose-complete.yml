version: '3.8'

services:
  odoo:
    image: odoo:17.0
    container_name: odoo
    restart: unless-stopped
    environment:
      - HOST=${COMPLETE_ODOO_DB_HOST}
       - USER=${COMPLETE_ODOO_USER}
      - PASSWORD=${COMPLETE_ODOO_PASSWORD}
    ports:
      - "8069:8069"
    depends_on:
      - postgre
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
  postgre:
    image: postgres:15
    container_name: postgree
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
volumes:
  odoo-web-data:
  odoo-db-data:
